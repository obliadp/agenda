name: labeler

on:
  # pull_request_target so fork PRs get labeled too; the job runs only the
  # pinned action against the base branch's config, never PR code.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
